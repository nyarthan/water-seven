# Authoritative Water Seven Hyprland configuration.
# Generated bindings and Nix store paths are isolated in the imported fragment.
source = ~/.config/water-seven/generated/hyprland.conf

monitor = , preferred, auto, 1

input {
  kb_layout = us
  follow_mouse = 0
}

general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  layout = dwindle
}

decoration {
  rounding = 6
  active_opacity = 1.0
  inactive_opacity = 0.96
}

animations {
  enabled = true
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  focus_on_activate = true
}

exec-once = waybar
exec-once = swaybg -c 111111

# Platform-native hardware and utility bindings.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86KbdBrightnessUp, exec, brightnessctl --device='*::kbd_backlight' set 5%+
bindel = , XF86KbdBrightnessDown, exec, brightnessctl --device='*::kbd_backlight' set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86Sleep, exec, systemctl suspend
bind = SUPER, PRINT, exec, grim -g "$(slurp)" - | wl-copy
