# Authoritative Water Seven tmux configuration.
source-file ~/.config/water-seven/generated/tmux.conf

set -g default-terminal 'tmux-256color'
set -g prefix C-b
unbind C-a
bind C-b send-prefix

set -g status-keys vi
set -g mode-keys vi
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows off
set -g mouse on
set -g history-limit 100000
set -s escape-time 0
set -s focus-events on
set -s extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on

set -g set-titles on
set -g set-titles-string '#{pane_title}'

bind c new-window -c '#{pane_current_path}'
bind '"' split-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind u move-window -r
unbind r
bind r source-file ~/.config/tmux/tmux.conf
# Keep the Workmux dashboard one keystroke away from every workstation role.
bind w display-popup -E -w 90% -h 80% -d '#{pane_current_path}' '$SHELL -lc "exec workmux dashboard"'

set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'bg=#454759,fg=#B9C2DE'
set -g status-left '#S'
set -g status-right '#h'

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
